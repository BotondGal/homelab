apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-contenthub
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: content
      - podSelector:
          matchLabels:
            app.kubernetes.io/component: api
            app.kubernetes.io/name: content-hub
      ports:
      - protocol: TCP
        port: 5432