---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: chat-with-fallback
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-chat
      sectionName: http
  match:
    model: the-node/gemma4-12b-with-fallback
  virtualModel:
    failover:
      targets:
      - modelRef:
          name: the-node-gemma4-12b
        priority: 0
      - modelRef:
          name: openrouter-gemma-4-26b
        priority: 1
