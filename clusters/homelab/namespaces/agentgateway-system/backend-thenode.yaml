---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: the-node-embeddings
spec:
  parentRefs:
    - name: agentgateway-embeddings
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/embeddings
    backendRefs:
    - name: the-node-embeddings
      namespace: agentgateway-system
      group: agentgateway.dev
      kind: AgentgatewayBackend
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: the-node-embeddings
spec:
  ai:
    provider:
      custom:
        model: google/embeddinggemma-300m
        formats:
        - type: Embeddings
          path: /v1/embeddings
      host: the-node.gateway.svc.cluster.local
      port: 8001
  policies:
    ai:
      routes:
        "*": Embeddings
      modelAliases:
        the-node/embeddinggemma-300m: google/embeddinggemma-300m
