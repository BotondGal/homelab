services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: llama-server
    restart: unless-stopped
    ports:
      - "${TS_IP}:8000:8000"
    command:
      - --model
      - /models/unsloth/gemma-4-12b-it-Q4_K_M.gguf
      - --alias
      - unsloth/gemma-4-12B-it-GGUF
      - --api-key
      - LHxujYALxwThhR9U7cWzMhLimFNpaKgF
      - --temp
      - "0.5"
      - --top-p
      - "0.95"
      - --top-k
      - "64"
      - --gpu-layers
      - "999"
      - --ctx-size
      - "128000"
      - --threads
      - "8"
      - --cache-type-k
      - q4_0
      - --cache-type-v
      - q8_0
      - --flash-attn
      - "on"
      - --jinja
      - --metrics
      - --slots
      - --log-timestamps
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    volumes:
      - /opt/llamacpp/models:/models:ro
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    runtime: nvidia
